services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.42.4
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:8080/
      WEBHOOK_URL: http://localhost:8080/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "false" # Local HTTP sandbox only.
    volumes:
      - n8n_data:/home/node/.n8n
    expose: ["5678"]
  replay-manager:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [n8n]
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
volumes:
  n8n_data:
