# Example snippet for the EXISTING HTTPS server hosting n8n at its root.
# Copy web/ into /srv/replay-manager/. Serve it from the same nginx instance.
# Insert these locations alongside your existing n8n proxy locations.
# Do not change the existing n8n locations or authentication.
# Add `application/javascript mjs;` to the server's MIME mapping if needed.
location = /replay-manager { return 308 /replay-manager/; }
location ^~ /replay-manager/ {
  alias /srv/replay-manager/;
  index index.html;
  autoindex off;
  limit_except GET HEAD { deny all; }
  access_log off;
  add_header Cache-Control "no-store" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
}
