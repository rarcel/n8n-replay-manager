# Static assets only behind the existing Traefik. No n8n upstream.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  server {
    listen 8080;
    root /usr/share/nginx/html;
    # Relative redirect: preserve the public HTTPS scheme and port at Traefik.
    absolute_redirect off;
    location = /replay-manager { return 308 /replay-manager/; }
    location ^~ /replay-manager/ {
      limit_except GET HEAD { deny all; }
      index index.html;
      autoindex off;
      try_files $uri $uri/ =404;
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location / { return 404; }
  }
}
